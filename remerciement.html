<!doctype html>
<html lang="fr">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Yolo - Merci pour votre commande</title>
  <meta name="description" content="Merci pour votre commande chez Pizza Yolo.">
  <style>
    :root {
      --red: #d32f2f;
      --red-dark: #b71c1c;
      --gold: #d4af37;
      --bg-1: #0b0b0b;
      --bg-2: #141414;
      --text: #f6f6f6;
      --muted: #b7b7b7;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% 15%, rgba(211, 47, 47, 0.18), transparent 70%),
        radial-gradient(700px 420px at 85% 85%, rgba(212, 175, 55, 0.14), transparent 70%),
        linear-gradient(155deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
      padding: 34px 26px;
      text-align: center;
      animation: rise 500ms ease-out both;
    }

    .check {
      width: 78px;
      height: 78px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      box-shadow: 0 12px 36px rgba(46, 125, 50, 0.35);
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3.2vw, 2.35rem);
      line-height: 1.15;
    }

    .accent { color: var(--gold); }

    p {
      margin: 12px auto 0;
      max-width: 62ch;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    .session {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #d9d9d9;
      opacity: 0.9;
      word-break: break-all;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 18px;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      box-shadow: 0 10px 28px rgba(211, 47, 47, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .foot {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #a9a9a9;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 520px) {
      .card { padding: 26px 18px; border-radius: 18px; }
      .btn { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Merci, votre <span class="accent">commande</span> est validée</h1>
    <p>
      Le paiement a bien été confirmé. Votre commande est en cours de préparation chez Pizza Yolo.
      Si vous avez choisi la livraison, notre équipe partira dès que possible.
    </p>
    <p class="session" id="sessionInfo" hidden></p>

    <div class="actions">
      <a class="btn btn-primary" href="pizzeria.html">Revenir au menu</a>
      <a class="btn btn-secondary" href="tel:+33235083338">Nous appeler</a>
    </div>

    <p class="foot">Besoin d'aide ? 02 35 08 33 38</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      const el = document.getElementById('sessionInfo');
      el.hidden = false;
      el.textContent = 'Référence de paiement : ' + sessionId;
    }
  </script>
</body>
</html>
